version: 2

models:
  - name: stg_payments
    description: Raw payment transactions processed through various payment systems.
    columns:
      - name: id
        description: Unique sequential identifier of the payment record (UInt64).
        data_tests:
          - unique
          - not_null

      - name: payment_uid
        description: Universally unique identifier (UUID) of the payment transaction.
        data_tests:
          - unique
          - not_null

      - name: user_id
        description: Identifier of the user who initiated the payment (UInt32).
        data_tests:
          - not_null

      - name: payment_system_id
        description: Identifier of the payment gateway or provider (UInt32).
        data_tests:
          - not_null

      - name: status
        description: Current processing status of the payment.
        data_tests:
          - not_null
          - accepted_values:
              values: ['pending', 'success', 'declined']

      - name: amount_eur
        description: Transaction amount in Euros (Decimal64(2)).
        data_tests:
          - not_null

      - name: created_at
        description: Timestamp when the payment was created in the source system.
        data_tests:
          - not_null

      - name: loaded_at
        description: Technical timestamp indicating when the record was ingested into the bronze layer.
        data_tests:
          - not_null

      - name: dt
        description: Partition key representing the event date (YYYY-MM-DD).
        data_tests:
          - not_null
