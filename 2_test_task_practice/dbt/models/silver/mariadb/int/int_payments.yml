version: 2

models:
  - name: int_payments
    description: >
      Deduplicated and soft-delete-filtered payments table on MergeTree,
      incrementally updated via partition overwrite from the raw ReplacingMergeTree model.
    columns:
      - name: payment_id
        description: Primary unique identifier of the payment record.
        tests:
          - not_null
          - unique

      - name: payment_uuid
        description: Unique external UUID of the payment transaction (used to link orders and refunds).
        tests:
          - not_null
          - unique

      - name: user_id
        description: Identifier of the user who initiated the payment.
        tests:
          - not_null
          - relationships:
              to: ref('stg_users')
              field: user_id

      - name: payment_system_id
        description: Identifier of the payment gateway/provider.
        tests:
          - not_null
          - relationships:
              to: ref('stg_payment_systems')
              field: payment_system_id

      - name: payment_status
        description: Current status of the payment (e.g., pending, succeeded, failed).
        tests:
          - not_null

      - name: payment_amount_eur
        description: Payment amount in EUR (Decimal64 with 2 decimal places).
        tests:
          - not_null

      - name: payment_created_at
        description: Timestamp when the payment was created (used for monthly partitioning).
        tests:
          - not_null

      - name: dt
        description: Payment creation date derived from payment_created_at.
        tests:
          - not_null

      - name: _version
        description: Monotonic CDC version (`_offset + 1` for CDC events, `0` for historical batch rows). Used as an incremental watermark.
        tests:
          - not_null
