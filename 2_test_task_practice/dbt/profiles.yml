default:
  define: &base_parameters
    type: clickhouse
    secure: False
    host: "{{ env_var('CH_ETL_HOST', 'clickhouse') }}"
    port: "{{ env_var('CH_ETL_PORT', '8123') | as_number }}"
    user: etl_user
    password: "{{ env_var('CH_ETL_PASSWORD') }}"
    schema: dev
    threads: 3

  target: dev
  outputs:
    dev:
      <<: *base_parameters
      schema: dev

    bronze:
      <<: *base_parameters
      schema: bronze

    silver:
      <<: *base_parameters
      schema: silver

    gold:
      <<: *base_parameters
      schema: gold
