debezium.sink.type=http
debezium.sink.http.url=http://cdc-file-sink:8080
debezium.sink.http.headers.Content-Type=application/json

debezium.source.connector.class=io.debezium.connector.mariadb.MariaDbConnector
debezium.source.database.hostname=mariadb
debezium.source.database.port=3306
debezium.source.database.user=root
debezium.source.database.password=${MARIADB_ROOT_PASSWORD}
debezium.source.database.ssl.mode=disabled
debezium.source.driver.sslMode=disable
debezium.source.database.server.id=184059
debezium.source.topic.prefix=app_cdc
debezium.source.database.include.list=app
debezium.source.table.include.list=app.users,app.plans,app.payment_systems,app.payments,app.orders,app.activations,app.usage_daily,app.refunds
debezium.source.snapshot.mode=schema_only
debezium.source.include.schema.changes=false
debezium.source.decimal.handling.mode=double

debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schemahistory.dat

debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.key=json
debezium.format.key.schemas.enable=false

debezium.transforms=unwrap
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
debezium.transforms.unwrap.drop.tombstones=true
debezium.transforms.unwrap.delete.handling.mode=rewrite
debezium.transforms.unwrap.add.fields=op,source.ts_ms,table
