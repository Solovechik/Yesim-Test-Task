services:
  mariadb:
    ports:
      - '3307:3306'

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    container_name: redpanda
    restart: unless-stopped
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --mode dev-container
    ports:
      - '19092:19092'
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true"']
      interval: 5s
      timeout: 5s
      retries: 10

  debezium:
    image: quay.io/debezium/connect:2.7.3.Final
    container_name: debezium
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
    ports:
      - '8083:8083'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8083/connectors']
      interval: 5s
      timeout: 5s
      retries: 15

  debezium-init:
    image: curlimages/curl:8.10.1
    container_name: debezium-init
    env_file:
      - .env
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./debezium/connector.json:/connector.json.tpl:ro
    entrypoint: |
      /bin/sh -c '
      awk -v pwd="$MARIADB_ROOT_PASSWORD" "{gsub(/__MARIADB_ROOT_PASSWORD__/, pwd); print}" /connector.json.tpl > /tmp/connector.json
      /usr/bin/curl -s -o /dev/null -w "%{http_code}" http://debezium:8083/connectors/mariadb-app-connector | grep -q 200 || \
      /usr/bin/curl -i -X POST -H "Accept:application/json" -H "Content-Type:application/json" \
      http://debezium:8083/connectors/ -d @/tmp/connector.json
      '

  clickhouse:
    image: clickhouse/clickhouse-server:26.10-alpine
    container_name: clickhouse-server
    restart: unless-stopped
    ports:
      - '8124:8123'
      - '9001:9000'
    env_file:
      - .env
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/initdb:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/users.d/z_collections.xml:/etc/clickhouse-server/users.d/z_collections.xml:ro
    depends_on:
      mariadb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8123/ping']
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: de-test-part2-airflow:local
    container_name: airflow-server
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/data/airflow.db
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__PARALLELISM: '2'
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '2'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - airflow_data:/opt/airflow/data
    depends_on:
      clickhouse:
        condition: service_healthy
      debezium-init:
        condition: service_completed_successfully

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio-sandbox
    user: root
    ports:
      - '9100:9000'
      - '9101:9001'
    environment:
      MINIO_ROOT_USER: 'minioadmin'
      MINIO_ROOT_PASSWORD: 'minioadmin'
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q --spider http://localhost:9000/minio/health/live || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: amazon/aws-cli:2.42.1
    container_name: create-buckets
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c '
      aws --endpoint-url http://minio:9000 s3 ls s3://lakehouse >/dev/null 2>&1 || \
      aws --endpoint-url http://minio:9000 s3 mb s3://lakehouse
      '

volumes:
  clickhouse_data:
  airflow_data:
  minio_data:
