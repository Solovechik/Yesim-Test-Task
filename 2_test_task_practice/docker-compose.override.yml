services:
  mariadb:
    ports:
      - '3307:3306'

  clickhouse:
    image: clickhouse/clickhouse-server:26.10-alpine
    container_name: clickhouse-server
    restart: unless-stopped
    ports:
      - '8124:8123'
      - '9001:9000'
    env_file:
      - .env
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/initdb:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/users.d/z_collections.xml:/etc/clickhouse-server/users.d/z_collections.xml:ro
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8123/ping']
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: de-test-part2-airflow:local
    container_name: airflow-server
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/data/airflow.db
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - airflow_data:/opt/airflow/data
    depends_on:
      - clickhouse

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio-sandbox
    user: root
    ports:
      - '9100:9000'
      - '9101:9001'
    environment:
      MINIO_ROOT_USER: 'minioadmin'
      MINIO_ROOT_PASSWORD: 'minioadmin'
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q --spider http://localhost:9000/minio/health/live || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: amazon/aws-cli:2.42.1
    container_name: create-buckets
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c '
      aws --endpoint-url http://minio:9000 s3 ls s3://lakehouse >/dev/null 2>&1 || \
      aws --endpoint-url http://minio:9000 s3 mb s3://lakehouse
      '

volumes:
  clickhouse_data:
  airflow_data:
  minio_data:
